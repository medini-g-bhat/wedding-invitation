<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Sampreeth & Medini Wedding</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary-bg: #ffffff;
            --gold-light: #bf953f;  
            --gold-mid: #c8973a;    
            --gold-dark: #9c7e2d;   
            --text-dark: #4a4a4a;   
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ── FIXED NAVIGATION ── */
        .nav-container {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 500px;
        }

        .top-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(200, 151, 58, 0.2);
            padding: 10px 25px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(156, 126, 45, 0.08);
        }

        .top-nav a {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--gold-dark);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* ── HERO SECTION ── */
        header {
            height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px 20px;
            background: linear-gradient(135deg, #f4f7f9 0%, #fcf8f2 50%, #f2f6f8 100%);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 4px;
            color: var(--gold-dark);
            animation: floatingNames 4s ease-in-out infinite alternate;
        }

        header p {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 15px;
            color: var(--gold-dark);
        }

        /* ── CONTENT SECTIONS ── */
        section { padding: 50px 20px; max-width: 800px; margin: auto; }

        h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            text-align: center;
            letter-spacing: 4px;
            color: var(--gold-dark);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .matched-frame {
            background: rgba(253, 250, 244, 0.6);
            border: 1px solid rgba(200, 151, 58, 0.15);
            padding: 30px 25px;
            border-radius: 16px;
            text-align: center;
        }

        .matched-frame p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .clock-row {
            display: flex;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--gold-dark);
            gap: 15px;
        }

        /* ── ANIMATIONS ── */
        @keyframes floatingNames {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .matched-frame { padding: 20px; }
            .nav-container { top: 15px; }
            .top-nav { padding: 8px 15px; }
            .top-nav a { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="nav-container">
        <nav class="top-nav">
            <a href="events.html">Events</a>
            <a href="rsvp.html">RSVP</a>
            <a href="memories.html">Memories</a>
        </nav>
    </div>

    <header>
        <div>
            <h1>Sampreeth <span>&amp;</span> Medini</h1>
            <p>We Are Getting Married!</p>
        </div>
    </header>

    <section>
        <h2>Our Love Story</h2>
        <div class="matched-frame">
            <p>What started as a lighthearted match by friends quickly turned into our destined path. Join us as we celebrate our bond through the sacred ritual of ‘Gandharva Vivaha’.</p>
        </div>
    </section>

    <section>
        <h2>The Countdown</h2>
        <div class="matched-frame" id="timer-box">
            <div class="clock-row">
                <span id="days">00</span>:
                <span id="hours">00</span>:
                <span id="minutes">00</span>:
                <span id="seconds">00</span>
            </div>
        </div>
    </section>

    <script>
        const targetDate = new Date("December 4, 2026 09:00:00").getTime();
        function updateTimer() {
            const now = Date.now();
            const gap = targetDate - now;
            const d = Math.floor(gap / 86400000);
            const h = Math.floor((gap % 86400000) / 3600000);
            const m = Math.floor((gap % 3600000) / 60000);
            const s = Math.floor((gap % 60000) / 1000);
            document.getElementById("days").innerText = d.toString().padStart(2, '0');
            document.getElementById("hours").innerText = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = s.toString().padStart(2, '0');
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
