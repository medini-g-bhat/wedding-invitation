<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Sampreeth & Medini Wedding</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* Reset and ensure no system-level color interference */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body, html {
      height: 100%;
      width: 100%;
      font-family: 'Josefin Sans', sans-serif;
      background-color: #f7f3eb !important; /* Solid base color */
    }

    .split-wrap {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .left {
      position: relative;
      width: 50%;
      height: 100%;
      background: #4a3e29 url('image/WhatsApp Image 2026-02-21 at 10.56.32 PM.jpeg') no-repeat center center / cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Solid color overlay: Ensures identical darkness/contrast on all screens */
    .left::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.4); 
      z-index: 2;
    }

    .left-content {
      position: relative;
      z-index: 3;
      text-align: center;
    }

    .left-name {
      font-family: 'Great Vibes', cursive;
      font-size: 4rem;
      color: #ffffff;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    .right {
      width: 50%;
      height: 100%;
      background-color: #f7f3eb !important; /* Solid color, no gradient */
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .right-content { max-width: 400px; }

    .right-content h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #9c7e2d !important;
      margin-bottom: 20px;
    }

    .right-content p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      color: #5a554a !important;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 15px 40px;
      border: 1px solid #9c7e2d;
      background: #ffffff;
      color: #9c7e2d;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 2px;
    }

    /* Mobile handling: Forces simple stacked view */
    @media (max-width: 768px) {
      .split-wrap { flex-direction: column; height: auto; }
      .left { width: 100%; height: 50vh; }
      .right { width: 100%; height: 50vh; }
    }
  </style>
</head>
<body>

<div class="split-wrap">
  <div class="left">
    <div class="left-content">
      <div class="left-name">Sampreeth & Medini</div>
    </div>
  </div>

  <div class="right">
    <div class="right-content">
      <h1>You Are Invited!</h1>
      <p>Join us as we celebrate our love and begin a beautiful new journey together.</p>
      <a href="main.html" class="btn">Join the Celebration</a>
    </div>
  </div>
</div>

</body>
</html>
